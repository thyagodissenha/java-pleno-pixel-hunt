# SonarQube — Java Pleno Pixel Hunt
# Next.js 16 + React 19 + TypeScript 5.9 + Canvas + Web Audio

sonar.projectKey=java-pleno-pixel-hunt
sonar.projectName=Java Pleno Pixel Hunt
sonar.host.url=http://localhost:9000

sonar.sourceEncoding=UTF-8

# Sources — App Router + lib
sonar.sources=app,lib

# Tests (quando existirem)
sonar.tests=app,lib
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/public/**,**/*.config.*,next-env.d.ts

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/mocks/**

# Coverage reports (Vitest LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
